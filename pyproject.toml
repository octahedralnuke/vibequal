[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibequal"
version = "1.0.0"
description = "Reproducible CAD-to-modal vibration screening for electronics enclosures"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "gmsh>=4.13,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]
report = ["reportlab>=4.2,<6"]

[project.scripts]
vibequal = "vibequal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibequal = ["templates/*.html", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Gmsh and the external CalculiX ccx executable"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
