name: Verification
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -m 'not integration' -q
      - run: ruff check .
      - run: python -m build
  solver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y calculix-ccx libglu1-mesa
      - run: python -m pip install -e '.[dev]'
      - run: vibequal doctor
      - run: python -m pytest -m integration -q
      - run: vibequal demo --out runs/ci-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calculation-evidence
          path: runs/
